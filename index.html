<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>シンOneStep メンバー紹介 | 編集対応</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",Meiryo,sans-serif;color:#202c3a;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,420px);padding:32px;background:#fff;border:1px solid #e1e8ef;border-radius:18px;box-shadow:0 12px 40px #1f344014}.mark{width:44px;height:44px;border-radius:14px;background:#eaf1f7;color:#315c84;display:grid;place-items:center;font-size:22px;margin-bottom:18px}.card h1{font-size:1.4rem;margin:0 0 8px}.card p{margin:0 0 22px;color:#607184}.card label{display:block;font-weight:600;margin-bottom:7px}.card input{width:100%;padding:12px 14px;border:1px solid #cad6e0;border-radius:10px;font:inherit}.card input:focus{outline:3px solid #477aa826;border-color:#477aa8}.card button{width:100%;margin-top:12px;padding:12px 14px;background:#315c84;color:#fff;border:0;border-radius:10px;font:inherit;font-weight:650;cursor:pointer}.error{color:#a22929;min-height:1.5em;margin-top:10px;font-size:.92rem}#site{display:none;width:100%;min-height:100vh;border:0;background:#f4f7fa}.hint{text-align:center;font-size:.78rem;color:#8090a0;margin-top:18px}</style></head>
<body><main class="gate" id="gate"><form class="card" id="form"><div class="mark" aria-hidden="true">✦</div><h1>シンOneStep メンバー紹介</h1><p>閲覧するには鍵を入力してください。</p><label for="key">閲覧鍵</label><input type="password" id="key" autocomplete="current-password" required><button type="submit">開く</button><div class="error" id="error" role="alert"></div><div class="hint">プロフィールデータは暗号化されています。</div></form></main><div id="site"></div>
<script>
const SUPABASE_URL="https://dtihrpjoengpakwipehl.supabase.co", SUPABASE_KEY="sb_publishable__d5BEd58nkRFmlfbneFvfw_nyBCzvIX", EDIT_PASSWORD="onestepedit";
const ITERATIONS=600000, AAD=new TextEncoder().encode("shin-onestep-profile-v1");
const enc=x=>new TextEncoder().encode(x), fromHex=s=>Uint8Array.from(s.match(/../g).map(x=>parseInt(x,16)));
async function derive(password,salt){const material=await crypto.subtle.importKey("raw",enc(password),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITERATIONS,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt","encrypt"])}

let pages, viewPassword="", editMode=false;
async function supabaseRpc(name, body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(`保存先エラー (${r.status})`);return r.json()}
function renderSite(data){pages=data;
  const indexDoc=new DOMParser().parseFromString(pages.index,"text/html"),profileDoc=new DOMParser().parseFromString(pages.contents,"text/html");
  const style=document.createElement("style");style.textContent=[...indexDoc.querySelectorAll("style"),...profileDoc.querySelectorAll("style")].map(x=>x.textContent).join("\n")+"\n#site #directory.container{display:block;max-width:1080px}#site #directory .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}#site #directory #member-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}#site #directory #member-list li a{height:100%}#site [hidden]{display:none!important}#site .back-button{display:inline-block;margin:12px 0;padding:8px 12px;border-radius:9px;background:#eaf1f7;color:#315c84;text-decoration:none;font-weight:600}#site .all-members-button{display:inline-block;margin:0 0 18px;padding:11px 16px;border-radius:10px;background:#315c84;color:#fff;text-decoration:none;font-weight:700}#site #all-view{max-width:1080px}#site #all-view .member-table{margin:0 0 28px}#editor-bar{position:sticky;top:0;z-index:20;background:#fff;border:1px solid #d9e2ea;border-radius:12px;padding:12px;margin:12px auto;max-width:1080px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 4px 16px #1f344014}#editor-bar button{border:0;border-radius:9px;padding:10px 14px;background:#315c84;color:#fff;font:inherit;font-weight:650;cursor:pointer}#editor-bar .secondary{background:#eaf1f7;color:#315c84}#editor-status{font-size:.9rem;color:#607184}#site [contenteditable=true]{outline:2px solid #8ab1d4;background:#fffef0;border-radius:3px;min-width:4em}#editor-bar[hidden]{display:none!important}";document.head.append(style);
  const site=document.getElementById("site"),header=indexDoc.querySelector("header").cloneNode(true),directory=document.createElement("main"),view=document.createElement("main"),allView=document.createElement("main");directory.className="container";directory.id="directory";view.className="container";view.id="profile-view";view.hidden=true;allView.className="container";allView.id="all-view";allView.hidden=true;
  const list=indexDoc.querySelector("#member-list").cloneNode(true),cards=[...profileDoc.querySelectorAll(".member-table")],cardMap=new Map();for(const card of cards){const id=card.querySelector("th[id]")?.id;if(id)cardMap.set(id,card)}
  for(const li of list.querySelectorAll("li")){const a=li.querySelector("a"),id=a?.getAttribute("href")?.match(/#(\d+)$/)?.[1];if(id){a.href="#member-"+id;a.dataset.member=id}}
  const toolbar=indexDoc.querySelector(".toolbar")?.cloneNode(true);if(toolbar)directory.append(toolbar);const allLink=document.createElement("a");allLink.className="all-members-button";allLink.href="#all-members";allLink.textContent="全員を上から順番に見る";directory.append(allLink,list);const back=document.createElement("a");back.className="back-button";back.href="#directory";back.textContent="← メンバー一覧へ";back.addEventListener("click",e=>{e.preventDefault();view.hidden=true;allView.hidden=true;directory.hidden=false;window.scrollTo(0,0)});
  const allBack=back.cloneNode(true),allBackBottom=back.cloneNode(true);for(const link of [allBack,allBackBottom])link.addEventListener("click",e=>{e.preventDefault();allView.hidden=true;directory.hidden=false;window.scrollTo(0,0)});allView.append(allBack,...cards.map(card=>card.cloneNode(true)),allBackBottom);allLink.addEventListener("click",e=>{e.preventDefault();directory.hidden=true;allView.hidden=false;window.scrollTo(0,0)});
  list.addEventListener("click",e=>{const a=e.target.closest("a[data-member]");if(!a)return;e.preventDefault();const card=cardMap.get(a.dataset.member);if(!card)return;view.replaceChildren(back,card.cloneNode(true));directory.hidden=true;view.hidden=false;window.scrollTo(0,0)});
  const search=toolbar?.querySelector("#member-search"),count=toolbar?.querySelector("#member-count");search?.addEventListener("input",()=>{const q=search.value.trim().toLocaleLowerCase();let visible=0;for(const li of list.querySelectorAll("li")){const show=li.textContent.toLocaleLowerCase().includes(q);li.hidden=!show;if(show)visible++}if(count)count.textContent=q?`検索結果 ${visible}名`:`メンバー ${list.querySelectorAll("li").length}名`});
  site.replaceChildren(header,directory,view,allView);
  const bar=document.createElement("section");bar.id="editor-bar";bar.innerHTML='<button id="edit-toggle">プロフィールを編集</button><span id="editor-status">変更内容はこのサイトを使う人に共有されます。</span><button id="save-edits" hidden>変更を保存</button><button id="cancel-edits" class="secondary" hidden>編集をやめる</button>';site.insertBefore(bar,directory);
  const toggle=bar.querySelector("#edit-toggle"),save=bar.querySelector("#save-edits"),cancel=bar.querySelector("#cancel-edits"),status=bar.querySelector("#editor-status");
  toggle.addEventListener("click",()=>{const pw=prompt("編集パスワードを入力してください");if(pw!==EDIT_PASSWORD){if(pw!==null)status.textContent="パスワードが違います。";return}editMode=true;toggle.hidden=true;save.hidden=false;cancel.hidden=false;status.textContent="全員を上から順に見て、変更したい内容を直接編集してください。";allLink.click();document.querySelectorAll("#all-view td").forEach(td=>td.contentEditable="true")});
  cancel.addEventListener("click",()=>location.reload());
  save.addEventListener("click",async()=>{save.disabled=true;status.textContent="暗号化して保存しています…";try{const source=new DOMParser().parseFromString(pages.contents,"text/html");const originals=[...source.querySelectorAll(".member-table")],edits=[...site.querySelectorAll("#all-view .member-table")];const byId=new Map(edits.map(c=>[c.querySelector("th[id]")?.id,c]));for(const original of originals){const id=original.querySelector("th[id]")?.id,edited=byId.get(id);if(!edited)continue;const a=[...original.querySelectorAll("td")],b=[...edited.querySelectorAll("td")];for(let i=0;i<Math.min(a.length,b.length);i++)a[i].innerHTML=b[i].innerHTML}pages.contents="<!doctype html>\n"+source.documentElement.outerHTML;
      const salt=crypto.getRandomValues(new Uint8Array(16)),nonce=crypto.getRandomValues(new Uint8Array(12)),key=await derive(viewPassword,salt),plain=enc(JSON.stringify(pages)),compressed=await new Response(new Blob([plain]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer(),cipher=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:nonce,additionalData:AAD},key,compressed));const hex=x=>[...x].map(v=>v.toString(16).padStart(2,"0")).join("");const bundle={version:1,kdf:"PBKDF2-SHA256",iterations:ITERATIONS,cipher:"AES-256-GCM",salt:hex(salt),nonce:hex(nonce),ciphertext:hex(cipher)};await supabaseRpc("save_profile_bundle",{p_password:EDIT_PASSWORD,p_bundle:bundle});status.textContent="保存しました。次に開いた人にも変更が表示されます。";document.querySelectorAll("#all-view td").forEach(td=>td.contentEditable="false");editMode=false;save.hidden=true;cancel.hidden=true;toggle.hidden=false}catch(err){status.textContent="保存できませんでした。Supabaseの初期設定が完了しているか確認してください。";console.error(err)}finally{save.disabled=false}});
  document.getElementById("gate").style.display="none";site.style.display="block";
}
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("error"),key=document.getElementById("key").value;msg.textContent="";try{viewPassword=key;let box;try{box=await supabaseRpc("get_profile_bundle",{});if(!box||!box.ciphertext)throw 0}catch{const r=await fetch("profiles.enc.json",{cache:"no-store"});if(!r.ok)throw 0;box=await r.json()}const cryptoKey=await derive(key,fromHex(box.salt)),encrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromHex(box.nonce),additionalData:AAD},cryptoKey,fromHex(box.ciphertext)),plain=await new Response(new Blob([encrypted]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();renderSite(JSON.parse(new TextDecoder().decode(plain)))}catch(err){console.error(err);msg.textContent=`読み込みエラー: ${err.name} ${err.message}`}});
</script></body></html>
